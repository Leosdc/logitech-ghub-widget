name: Build, Audit & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-extension:
    name: Pack GNOME extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin zip gjs gir1.2-upowerglib-1.0

      - name: Unit tests
        working-directory: gnome-extension
        run: gjs -m tests/run.js

      - name: Race test
        working-directory: gnome-extension
        run: gjs -m tests/upowerSource.race.test.js

      - name: Compile schemas
        run: glib-compile-schemas --strict gnome-extension/schemas/

      - name: Build zip (same layout as gnome-extensions pack; timestamps differ)
        working-directory: gnome-extension
        run: |
          zip -r "../ghub-battery@vinipy12.github.io.shell-extension.zip" \
            metadata.json extension.js prefs.js stylesheet.css \
            upowerSource.js model.js panelItem.js menu.js notifier.js \
            schemas/org.gnome.shell.extensions.ghub-battery.gschema.xml schemas/gschemas.compiled
          unzip -l "../ghub-battery@vinipy12.github.io.shell-extension.zip"
          for f in metadata.json extension.js prefs.js stylesheet.css upowerSource.js model.js panelItem.js menu.js notifier.js schemas/org.gnome.shell.extensions.ghub-battery.gschema.xml schemas/gschemas.compiled; do
            unzip -l "../ghub-battery@vinipy12.github.io.shell-extension.zip" | grep -q " $f$" || { echo "MISSING $f"; exit 1; }
          done

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-extension
          path: ghub-battery@vinipy12.github.io.shell-extension.zip

  build:
    name: Build & Package Release
    runs-on: windows-latest
    needs: pack-extension

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: |
          dotnet restore src/GHubWidget.csproj
          dotnet restore cli/GHubCli.csproj

      - name: Publish Widget Binaries (Clean Release, No PDB, Deterministic)
        run: |
          dotnet publish src/GHubWidget.csproj -c Release -o build/widget /p:DebugType=none /p:DebugSymbols=false /p:ContinuousIntegrationBuild=true
          if (Test-Path "build/widget/*.pdb") { Remove-Item "build/widget/*.pdb" -Force }

      - name: Publish CLI Binaries (Cross-Platform Single-File)
        run: |
          dotnet publish cli/GHubCli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o build/cli/win-x64
          dotnet publish cli/GHubCli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o build/cli/linux-x64
          dotnet publish cli/GHubCli.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o build/cli/osx-x64
          dotnet publish cli/GHubCli.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o build/cli/osx-arm64

          Compress-Archive -Path 'build/cli/win-x64/ghub-cli.exe' -DestinationPath 'ghub-cli-win-x64.zip' -Force
          tar -czf ghub-cli-linux-x64.tar.gz -C build/cli/linux-x64 ghub-cli
          tar -czf ghub-cli-osx-x64.tar.gz -C build/cli/osx-x64 ghub-cli
          tar -czf ghub-cli-osx-arm64.tar.gz -C build/cli/osx-arm64 ghub-cli

      - name: Generate Widget Release Zip Package
        run: |
          $pkg = 'build/package'
          if (Test-Path $pkg) { Remove-Item $pkg -Recurse -Force }
          New-Item -ItemType Directory -Path "$pkg/installer" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkg/build/widget" -Force | Out-Null

          Get-ChildItem -Path 'build/widget' -File | Where-Object { $_.Extension -ne '.pdb' } | ForEach-Object {
              Copy-Item $_.FullName -Destination "$pkg/build/widget" -Force
              Copy-Item $_.FullName -Destination $pkg -Force
          }

          Copy-Item 'installer/*' -Destination "$pkg/installer" -Force
          Copy-Item 'installer/Instalar-Widget.ps1' -Destination $pkg -Force
          Copy-Item 'installer/Instalar-GUI.ps1' -Destination $pkg -Force

          Copy-Item 'Instalar-Widget.bat' -Destination $pkg -Force
          Copy-Item 'Instalar-Com-Interface.bat' -Destination $pkg -Force
          Copy-Item 'Desinstalar-Widget.bat' -Destination $pkg -Force
          if (Test-Path 'README.md') { Copy-Item 'README.md' -Destination $pkg -Force }
          if (Test-Path 'CHANGELOG.md') { Copy-Item 'CHANGELOG.md' -Destination $pkg -Force }
          if (Test-Path 'SECURITY.md') { Copy-Item 'SECURITY.md' -Destination $pkg -Force }
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' -Destination $pkg -Force }
          if (Test-Path 'ghub-cli.py') { Copy-Item 'ghub-cli.py' -Destination $pkg -Force }

          if (Test-Path 'Logitech-GHub-Widget-Setup.zip') { Remove-Item 'Logitech-GHub-Widget-Setup.zip' -Force }
          Compress-Archive -Path "$pkg/*" -DestinationPath 'Logitech-GHub-Widget-Setup.zip' -Force
          Remove-Item $pkg -Recurse -Force

      - name: Download GNOME extension artifact
        uses: actions/download-artifact@v4
        with:
          name: gnome-extension
          path: .

      - name: Compute SHA256 Hashes
        id: compute_hash
        run: |
          $zipHash = (Get-FileHash 'Logitech-GHub-Widget-Setup.zip' -Algorithm SHA256).Hash
          $dllHash = (Get-FileHash 'build/widget/LogitechGHubWidget.dll' -Algorithm SHA256).Hash
          $exeHash = (Get-FileHash 'build/widget/LogitechGHubWidget.exe' -Algorithm SHA256).Hash
          $cliWinHash = (Get-FileHash 'ghub-cli-win-x64.zip' -Algorithm SHA256).Hash
          $cliLinHash = (Get-FileHash 'ghub-cli-linux-x64.tar.gz' -Algorithm SHA256).Hash
          $cliMacX64Hash = (Get-FileHash 'ghub-cli-osx-x64.tar.gz' -Algorithm SHA256).Hash
          $cliMacArmHash = (Get-FileHash 'ghub-cli-osx-arm64.tar.gz' -Algorithm SHA256).Hash
          $pyHash = (Get-FileHash 'ghub-cli.py' -Algorithm SHA256).Hash
          $gnomeHash = (Get-FileHash 'ghub-battery@vinipy12.github.io.shell-extension.zip' -Algorithm SHA256).Hash
          
          Write-Host "=== SHA256 Verification ==="
          Write-Host "Logitech-GHub-Widget-Setup.zip: $zipHash"
          Write-Host "ghub-cli-win-x64.zip:           $cliWinHash"
          Write-Host "ghub-cli-linux-x64.tar.gz:      $cliLinHash"
          Write-Host "ghub-cli-osx-x64.tar.gz:        $cliMacX64Hash"
          Write-Host "ghub-cli-osx-arm64.tar.gz:      $cliMacArmHash"
          Write-Host "ghub-cli.py:                    $pyHash"
          
          "$zipHash  Logitech-GHub-Widget-Setup.zip" | Out-File -Encoding utf8 SHA256SUMS.txt
          "$dllHash  LogitechGHubWidget.dll" | Out-File -Encoding utf8 -Append SHA256SUMS.txt
          "$exeHash  LogitechGHubWidget.exe" | Out-File -Encoding utf8 -Append SHA256SUMS.txt
          "$cliWinHash  ghub-cli-win-x64.zip" | Out-File -Encoding utf8 -Append SHA256SUMS.txt
          "$cliLinHash  ghub-cli-linux-x64.tar.gz" | Out-File -Encoding utf8 -Append SHA256SUMS.txt
          "$cliMacX64Hash  ghub-cli-osx-x64.tar.gz" | Out-File -Encoding utf8 -Append SHA256SUMS.txt
          "$cliMacArmHash  ghub-cli-osx-arm64.tar.gz" | Out-File -Encoding utf8 -Append SHA256SUMS.txt
          "$pyHash  ghub-cli.py" | Out-File -Encoding utf8 -Append SHA256SUMS.txt
          "$gnomeHash  ghub-battery@vinipy12.github.io.shell-extension.zip" | Out-File -Encoding utf8 -Append SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Logitech-GHub-Widget-Setup
          path: |
            Logitech-GHub-Widget-Setup.zip
            ghub-cli-win-x64.zip
            ghub-cli-linux-x64.tar.gz
            ghub-cli-osx-x64.tar.gz
            ghub-cli-osx-arm64.tar.gz
            ghub-cli.py
            ghub-battery@vinipy12.github.io.shell-extension.zip
            SHA256SUMS.txt

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Logitech-GHub-Widget-Setup.zip
            ghub-cli-win-x64.zip
            ghub-cli-linux-x64.tar.gz
            ghub-cli-osx-x64.tar.gz
            ghub-cli-osx-arm64.tar.gz
            ghub-cli.py
            ghub-battery@vinipy12.github.io.shell-extension.zip
            SHA256SUMS.txt
          generate_release_notes: true
